[project]
name = "ezagent"
version = "0.1.0"
description = "Mensajero de voz con notch y menú desplegable; whisper.cpp, LLM configurable y Kokoro."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "Pillow>=11.0,<14",
    "PyAudio>=0.2.14,<0.3",
    "openai>=1.60,<4",
    "kokoro-onnx>=0.4,<1",
    "num2words>=0.5,<1",
    "loguru>=0.7,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
ezagent-voice = "ezagent.voice.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "pyinstaller>=6.22,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezagent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
