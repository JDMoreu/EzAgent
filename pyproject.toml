[project]
name = "ezagent"
version = "0.1.0"
description = "Mensajero de voz con notch y menú desplegable; whisper.cpp, LLM configurable y Kokoro."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0,<3",
    "Pillow>=11.0,<14",
    "PyAudio>=0.2.14,<0.3",
    "openai>=1.60,<4",
    "kokoro-onnx>=0.4,<1",
    "num2words>=0.5,<1",
    "loguru>=0.7,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.1",
    "pyyaml>=6.0,<7",
    "send2trash>=1.8,<2",
    "ddgs>=9.0,<10",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "pystray>=0.19.5,<1",
]

[project.scripts]
ezagent-voice = "ezagent.voice.app:main"

[project.optional-dependencies]
office = [
    "openpyxl>=3.1,<4",
    "pypdf>=5.0,<7",
    "python-docx>=1.1,<2",
    "reportlab>=4.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "pyinstaller>=6.22,<7",
    "ruff>=0.7,<1",
    "pyright>=1.1.380,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezagent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# DECISION: menu.py es un archivo prohibido en E0; su orden de imports y un
# import sobrante se corrigen en E5, cuando ya se puede tocar el archivo.
"src/ezagent/voice/notch/menu.py" = ["I001", "F401"]
