# Recursos que EzAgent descarga la primera vez. Todo vive bajo
# %LOCALAPPDATA%\EzAgent (o EZAGENT_HOME). Cada recurso lleva tamano y SHA256
# verificados contra la fuente oficial; sin hash correcto no se instala.
#
# NOTA: whisper.cpp no publica binarios de Windows con Vulkan. El recurso
# "whisper-vulkan" se anade aqui cuando exista un release de EzAgent que lo
# distribuya (ver docs/roadmap/etapas/E8-onboarding.md). Hasta entonces el
# motor "auto" cae a CPU salvo que la carpeta whisper/ ya contenga uno.

[[asset]]
id = "whisper-cpu"
label = "whisper.cpp (CPU)"
url = "https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip"
sha256 = "6ba69e3482d7826214f90a6a9c84ca07782aec1e1d0c6a7c30c994fd5d816ccb"
size = 8928640
dest = "whisper/cpu"
unzip = true
strip_prefix = "Release/"
license = "MIT"

