[package]
name = "ez-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ez_app"
path = "src/lib.rs"

[features]
replay = ["dep:serde_yaml"]

[[bin]]
name = "ezagent-voice"
path = "src/bin/ezagent_voice.rs"

[[bin]]
name = "ezagent-replay"
path = "src/bin/ezagent_replay.rs"
required-features = ["replay"]

[dependencies]
png = { workspace = true }
ndarray = { workspace = true }
windows = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
ez-core = { path = "../ez-core" }
ez-hud = { path = "../ez-hud" }
ez-gfx = { path = "../ez-gfx" }
ez-audio = { path = "../ez-audio" }
ez-tts = { path = "../ez-tts" }
ez-stt = { path = "../ez-stt" }
ez-llm = { path = "../ez-llm" }
ez-agent = { path = "../ez-agent" }
ez-herdr = { path = "../ez-herdr" }
ez-swarm = { path = "../ez-swarm" }
ez-chat = { path = "../ez-chat" }

[dev-dependencies]
ez-parity = { path = "../ez-parity" }
