# Recursos que EzAgent descarga la primera vez. Todo vive bajo
# %LOCALAPPDATA%\EzAgent (o EZAGENT_HOME). Cada recurso lleva tamano y SHA256
# verificados contra la fuente oficial; sin hash correcto no se instala.
#
# Este es el manifiesto propio de la version Rust: la version Python tenia el
# suyo (src/ezagent/core/manifest.toml) sin onnxruntime ni espeak-ng, porque los
# tomaba del entorno de Python.
#
# whisper.cpp no publica binarios de Windows con Vulkan: "whisper-vulkan" sale
# de un release de este repositorio (deps-whisper-vulkan-610e664, compilado del
# código original). El motor "auto" prefiere Vulkan y cae a CPU si no hay GPU.

[[asset]]
id = "whisper-cpu"
label = "whisper.cpp (CPU)"
url = "https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip"
sha256 = "6ba69e3482d7826214f90a6a9c84ca07782aec1e1d0c6a7c30c994fd5d816ccb"
size = 8928640
dest = "whisper/cpu"
unzip = true
strip_prefix = "Release/"
license = "MIT"

