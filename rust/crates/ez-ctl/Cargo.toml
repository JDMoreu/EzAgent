[package]
name = "ez-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ez_ctl"
path = "src/lib.rs"

[[bin]]
name = "ez"
path = "src/bin/ez.rs"

[[example]]
name = "e2e_delegate"
path = "examples/e2e_delegate.rs"

[[example]]
name = "e2e_retry"
path = "examples/e2e_retry.rs"

[[example]]
name = "e2e_inventory"
path = "examples/e2e_inventory.rs"

[dev-dependencies]
# Fixtures of the end-to-end inventory test: SQLite databases and RFC 3339
# timestamps. Both come from [workspace.dependencies]; no crate is added.
chrono = { workspace = true }
rusqlite = { workspace = true }

[dependencies]
ez-core = { path = "../ez-core" }
ez-herdr = { path = "../ez-herdr" }
ez-scan = { path = "../ez-scan" }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
