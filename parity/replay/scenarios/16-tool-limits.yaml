id: "16"
name: "Topes de rondas de herramientas y de llamadas por turno"
notes: >
  El modelo pide cinco herramientas en la primera ronda y otra en la segunda.
  El núcleo agéntico corta en cuatro llamadas por turno (la quinta devuelve
  error) y el mensajero reserva una ronda final sin herramientas, así que la
  última llamada no se ejecuta y la app cierra con los resultados disponibles.
settings:
  silence_secs: 1.0
  speech_secs_min: 0.2
  llm_max_tool_rounds: 1
llm:
  model: fake-model
  chunk_chars: 8
  turns:
    - finish_reason: tool_calls
      tool_calls:
        - {id: c1, name: get_datetime, arguments: "{}"}
        - {id: c2, name: get_datetime, arguments: "{}"}
        - {id: c3, name: get_datetime, arguments: "{}"}
        - {id: c4, name: get_datetime, arguments: "{}"}
        - {id: c5, name: get_datetime, arguments: "{}"}
    - finish_reason: tool_calls
      tool_calls:
        - {id: c6, name: get_datetime, arguments: "{}"}
whisper:
  transcripts:
    - "¿Qué hora es?"
  repeat_last: false
steps:
  - wait_state: listening
  - audio: que_hora_es.wav
  - wait_quiet: 25
  - wait_drained: 15
expect:
  states: [thinking, speaking, listening]
  user: ["¿Qué hora es?"]
  assistant:
    - "Conservé los resultados obtenidos, pero no pude completar la tarea. Todavía no hay una entrega final confirmada."
  speech_contains:
    - "Conservé los resultados obtenidos,"
    - "pero no pude completar la tarea."
  tool_calls:
    - "get_datetime {}"
    - "get_datetime {}"
    - "get_datetime {}"
    - "get_datetime {}"
  llm_requests: 2
  final:
    state: listening
    in_call: true
