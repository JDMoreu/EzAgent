id: "R05"
name: "LLM 401 y después un turno bueno"
notes: >
  La clave no vale: la app dice el mensaje amable, no reintenta y sigue
  escuchando; el turno siguiente (ya con el guion bueno) responde normal.
timeout: 180
settings:
  silence_secs: 1.0
  speech_secs_min: 0.6
llm:
  model: fake-model
  chunk_chars: 8
  turns:
    - status: 401
      error: "Invalid API key"
      error_type: "authentication_error"
    - content: "Estoy de vuelta."
whisper:
  transcripts:
    - "¿Qué hora es?"
    - "¿Me escuchas?"
steps:
  - wait_state: listening
  - audio: que_hora_es.wav
  - wait_speech: "La clave de Personalizado no es válida"
  - wait_quiet: 25
  - audio: que_hora_es.wav
  - wait_speech: "Estoy de vuelta"
  - wait_quiet: 30
expect:
  speech_contains:
    - "La clave de Personalizado no es válida o no tiene acceso. Revísala en ajustes."
  speech_any:
    - "Estoy de vuelta"
  llm_requests: 2
  final:
    state: listening
    in_call: true
