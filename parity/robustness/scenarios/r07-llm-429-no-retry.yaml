id: "R07"
name: "LLM 429 sin Retry-After"
notes: >
  Mismo límite sin cabecera `Retry-After`: la app dice «Espera un momento o»
  en vez de dar segundos, no reintenta y el turno siguiente responde.
timeout: 90
settings:
  silence_secs: 1.0
  speech_secs_min: 0.6
llm:
  model: fake-model
  chunk_chars: 8
  turns:
    - status: 429
      error: "rate limit"
      error_type: "rate_limit_error"
    - content: "Gracias por esperar."
whisper:
  transcripts:
    - "¿Qué hora es?"
    - "¿Ya?"
steps:
  - wait_state: listening
  - audio: que_hora_es.wav
  - wait_speech: "Espera un momento"
  - wait_quiet: 25
  - audio: que_hora_es.wav
  - wait_speech: "Gracias por esperar"
  - wait_quiet: 30
expect:
  speech_contains:
    - "Personalizado me limitó por demasiadas peticiones o tokens por minuto. Espera un momento o elige otro modelo o proveedor en ajustes."
  speech_any:
    - "Gracias por esperar"
  llm_requests: 2
  final:
    state: listening
    in_call: true
