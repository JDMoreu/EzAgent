name: Reporte de error
description: Informa un fallo reproducible de EzAgent
title: "[Error]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versión de EzAgent
      description: Va en pyproject.toml o en «Acerca de» del menú del notch.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      description: Por ejemplo, Windows 11 24H2. Puedes verla con winver.
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Qué hiciste, en orden, hasta que apareció el error.
      placeholder: |
        1. Abrí EzAgent con uv run ezagent-voice
        2. Dije «abre el proyecto»
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      description: Qué esperabas que pasara.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado real
      description: Qué pasó en realidad. Incluye el mensaje de error si lo hubo.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Pega las líneas relevantes de %APPDATA%\EzAgent\ y de la consola donde
        lanzaste la aplicación. Quita claves de API y datos personales antes de
        enviar.
      render: text
    validations:
      required: false
