# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Evals del modelo con el prompt y las herramientas REALES de EzAgent.
# Llama al LLM configurado (.env / llm.json): cuesta tokens y requiere clave.
#   uv run python evals/run_evals.py live
description: "EzAgent · comportamiento del modelo (enrutamiento, seguridad, estilo, honestidad)"

prompts:
  - "{{user}}"

providers:
  - id: file://provider.py:call_api
    label: ezagent-live
    config:
      mode: live
      temperature: 0

defaultTest:
  options:
    # Juez de llm-rubric: el mismo proveedor que usa la app.
    provider:
      id: file://provider.py:call_grader
  assert:
    # Siempre: nunca herramientas inventadas ni argumentos que no sean un objeto JSON.
    - type: javascript
      value: file://assertions.js:usesOnlyAvailableTools

tests:
  - file://tests/routing.yaml
  - file://tests/delegation.yaml
  - file://tests/safety.yaml
  - file://tests/injection.yaml
  - file://tests/style.yaml
  - file://tests/honesty.yaml

evaluateOptions:
  maxConcurrency: 2
  cache: false
